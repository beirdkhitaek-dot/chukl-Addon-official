name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --no-daemon

      - name: Inspect signatures
        run: |
          J=$(find ~/.gradle -name "*.jar" -size +8M ! -name "*sources*" 2>/dev/null | xargs -I{} sh -c 'javap -p -cp {} net.minecraft.client.render.entity.LivingEntityRenderer >/dev/null 2>&1 && echo {}' | head -1)
          for C in 'net.minecraft.client.render.command.OrderedRenderCommandQueue$Custom' 'net.minecraft.client.render.command.OrderedRenderCommandQueue$LayeredCustom' net.minecraft.client.render.RenderLayers net.minecraft.client.render.entity.state.BipedEntityRenderState net.minecraft.client.render.VertexConsumerProvider; do
            echo "--- $C"; javap -p -cp "$J" "$C" 2>&1 | head -90
          done
          echo "--- who has entityCutoutNoCull"; unzip -l "$J" | awk '{print $4}' | grep -E "net/minecraft/client/render/(RenderLayers|RenderTypes|RenderLayer)" | head
          echo "--- TextureManager"; javap -p -cp "$J" net.minecraft.client.texture.TextureManager 2>&1 | grep -i register
          echo "--- LightmapTextureManager"; javap -p -cp "$J" net.minecraft.client.render.LightmapTextureManager 2>&1 | grep -E "static" | head

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: chukl-addon
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  # Automatic release: when a push to main builds successfully, publish it as a GitHub release.
  # Title = "v<mod-version> - <update name>", where the update name is taken from the commit subject
  # ("1.19.0 - Energy orb render" -> "Energy orb render"). The jar is attached as chukl-addon-<mod-version>.jar.
  # If that version already has a release, nothing is published - bump mod-version to release again.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chukl-addon
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(grep '^mod-version' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already released - bump mod-version to publish a new release."
            exit 0
          fi
          JAR=$(find dist -name "chukl-addon-${VERSION}.jar" | head -n 1)
          test -n "$JAR"
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n 1)
          NAME=$(printf '%s' "$SUBJECT" | sed -E 's/^v?[0-9]+(\.[0-9]+)*[[:space:]]*[-:][[:space:]]*//')
          if [ -z "$NAME" ]; then NAME="Update"; fi
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          # Release notes: the "## v<version>" section of CHANGELOG.md (what's new + how to use), plus install and checksum info.
          SECTION=$(awk -v v="## v${VERSION}" '$0==v || index($0, v " ")==1 {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          {
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION"
            else
              printf '**What is new:** %s\n' "$NAME"
              echo
              echo "(No changelog entry was written for this version.)"
            fi
            echo
            echo "---"
            echo "**Install:** download \`chukl-addon-${VERSION}.jar\` below and put it in your \`mods\` folder (Fabric 1.21.11 + Meteor Client). Replace the old ChuklAddon jar when updating. Full history: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
            echo
            echo "Built by GitHub Actions from commit ${GITHUB_SHA}."
            echo "SHA-256 of \`chukl-addon-${VERSION}.jar\`: \`${SHA}\`"
          } > release-notes.md
          gh release create "v${VERSION}" "$JAR" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION} - ${NAME}" \
            --notes-file release-notes.md
